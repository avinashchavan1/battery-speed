# Generates BatterySpeed.xcodeproj: run `xcodegen` in this folder after changing it.
name: BatterySpeed
options:
  bundleIdPrefix: com.batteryspeed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BatterySpeed:
    type: application
    platform: iOS
    sources: [BatterySpeed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batteryspeed.ios
        PRODUCT_NAME: Battery Speed
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Battery Speed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing: open the project in Xcode, choose your team under Signing & Capabilities.
        CODE_SIGN_STYLE: Automatic
    info:
      path: BatterySpeed/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.batteryspeed.ios.refresh]
